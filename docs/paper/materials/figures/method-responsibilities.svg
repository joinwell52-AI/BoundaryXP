<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="490" viewBox="0 0 1080 490" role="img" aria-labelledby="figure-title figure-desc">
  <title id="figure-title">方法责任切分</title>
  <desc id="figure-desc">BXP共同约定连接语义生产、固定计算基准与确定性数学求值。未决返回澄清，准入与执行由宿主负责。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3f4b55"/></marker>
  </defs>
  <style>
    text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #17202a; }
    .head { font-size: 22px; font-weight: 600; }
    .body { font-size: 20px; }
    .note { font-size: 19px; }
    .panel { fill: #fafbfc; stroke: #6b7782; stroke-width: 1.5; }
    .line { fill: none; stroke: #3f4b55; stroke-width: 2; marker-end: url(#arrow); }
  </style>
  <rect x="8" y="8" width="1064" height="52" rx="5" fill="#e9eef2" stroke="#6b7782" stroke-width="1.5"/>
  <text class="head" x="540" y="42" text-anchor="middle">BXP共同约定：来源、身份、用途、形式化、判据与结果引用</text>

  <rect class="panel" x="8" y="84" width="330" height="230" rx="5"/>
  <text class="head" x="173" y="118" text-anchor="middle">语义生产与确认（S1—S4）</text>
  <text class="body" x="24" y="157">语言模型／规则／人工</text>
  <text class="body" x="24" y="191">原文 → 主张 → 类型及谓词映射</text>
  <text class="body" x="24" y="225">7+1用途与共享关联</text>
  <text class="body" x="24" y="259">双向来源核对；保留歧义</text>
  <text class="note" x="24" y="293">候选可以修订；确认依据须记录</text>

  <rect class="panel" x="376" y="84" width="310" height="230" rx="5"/>
  <text class="head" x="531" y="118" text-anchor="middle">共同计算基准（S5）</text>
  <text class="body" x="392" y="157">固定解释、身份、版本与单位</text>
  <text class="body" x="392" y="191">形式模型、观察域及映射</text>
  <text class="body" x="392" y="225">精确查询、来源与评估上下文</text>
  <text class="body" x="392" y="259">声明逻辑片段及编码条件</text>
  <text class="note" x="392" y="293">区分局部查询与完整任务保持</text>

  <rect class="panel" x="724" y="84" width="348" height="230" rx="5"/>
  <text class="head" x="898" y="118" text-anchor="middle">数学求值与评估（S6—S7）</text>
  <text class="body" x="740" y="157">计算内核：集合、布尔、区间</text>
  <text class="body" x="740" y="191">理论路径：受支持的逻辑判定程序</text>
  <text class="body" x="740" y="225">数学结果 → 按评估上下文归约</text>
  <text class="body" x="740" y="259">未完成计算保留原因</text>
  <text class="note" x="740" y="293">求值正确依赖前述语义与片段条件</text>

  <path class="line" d="M338 199 H371"/>
  <path class="line" d="M686 199 H719"/>
  <path class="line" d="M531 314 V341 H173 V359"/>
  <path class="line" d="M173 408 H0 V199 H7"/>
  <path class="line" d="M898 314 V359"/>
  <rect class="panel" x="8" y="364" width="678" height="66" rx="5"/>
  <text class="body" x="347" y="391" text-anchor="middle">未决／缺口 → 澄清、修订与重新计算</text>
  <text class="note" x="347" y="416" text-anchor="middle">已知不确定性不转换为确定结论；保留原因及适用范围</text>
  <rect class="panel" x="724" y="364" width="348" height="66" rx="5"/>
  <text class="body" x="898" y="391" text-anchor="middle">宿主独立检查准入与执行授权</text>
  <text class="note" x="898" y="416" text-anchor="middle">条件不成立或不可计算，不正式下发</text>
  <text class="note" x="540" y="470" text-anchor="middle">定理1—4提供条件性保证；工程须落实并记录这些前提。</text>
</svg>
