<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="490" viewBox="0 0 1080 490" role="img" aria-labelledby="figure-title figure-desc">
  <title id="figure-title">Method responsibilities</title>
  <desc id="figure-desc">BXP connects interpretation, a common basis, and mathematical evaluation.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3f4b55"/></marker>
  </defs>
  <style>
    text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #17202a; }
    .head { font-size: 20px; font-weight: 600; }
    .body { font-size: 18px; }
    .note { font-size: 17px; }
    .panel { fill: #fafbfc; stroke: #6b7782; stroke-width: 1.5; }
    .line { fill: none; stroke: #3f4b55; stroke-width: 2; marker-end: url(#arrow); }
  </style>
  <rect x="8" y="8" width="1064" height="52" rx="5" fill="#e9eef2" stroke="#6b7782" stroke-width="1.5"/>
  <text class="head" x="540" y="42" text-anchor="middle">BXP: sources, identities, purposes, formalization, queries, and result references</text>

  <rect class="panel" x="8" y="84" width="330" height="230" rx="5"/>
  <text class="head" x="173" y="118" text-anchor="middle">Semantic production (S1-S4)</text>
  <text class="body" x="24" y="157">LLM / rules / people</text>
  <text class="body" x="24" y="191">Source &gt; claims &gt; meanings</text>
  <text class="body" x="24" y="225">7+1 purposes and shared relations</text>
  <text class="body" x="24" y="259">Review sources; retain ambiguity</text>
  <text class="note" x="24" y="293">Record the basis of confirmation</text>

  <rect class="panel" x="376" y="84" width="310" height="230" rx="5"/>
  <text class="head" x="531" y="118" text-anchor="middle">Common basis (S5)</text>
  <text class="body" x="392" y="157">Fix meaning, identity, units, versions</text>
  <text class="body" x="392" y="191">Model, observation domain, mapping</text>
  <text class="body" x="392" y="225">Exact query and assessment context</text>
  <text class="body" x="392" y="259">Declare fragment and encoding</text>
  <text class="note" x="392" y="293">Separate local and whole-task claims</text>

  <rect class="panel" x="724" y="84" width="348" height="230" rx="5"/>
  <text class="head" x="898" y="118" text-anchor="middle">Evaluation (S6-S7)</text>
  <text class="body" x="740" y="157">Core: sets, logic, intervals</text>
  <text class="body" x="740" y="191">Theory: supported decision procedures</text>
  <text class="body" x="740" y="225">Math result &gt; typed assessment</text>
  <text class="body" x="740" y="259">Retain incomplete-query reasons</text>
  <text class="note" x="740" y="293">Correctness depends on the premises</text>

  <path class="line" d="M338 199 H371"/>
  <path class="line" d="M686 199 H719"/>
  <path class="line" d="M531 314 V341 H173 V359"/>
  <path class="line" d="M173 408 H0 V199 H7"/>
  <path class="line" d="M898 314 V359"/>
  <rect class="panel" x="8" y="364" width="678" height="66" rx="5"/>
  <text class="body" x="347" y="391" text-anchor="middle">Unresolved items &gt; clarification, revision, and reevaluation</text>
  <text class="note" x="347" y="416" text-anchor="middle">Known uncertainty remains explicit, with reasons and scope</text>
  <rect class="panel" x="724" y="364" width="348" height="66" rx="5"/>
  <text class="body" x="898" y="391" text-anchor="middle">Host checks admission and authority</text>
  <text class="note" x="898" y="416" text-anchor="middle">Unestablished conditions block release</text>
  <text class="note" x="540" y="470" text-anchor="middle">Theorems 1-4 give conditional guarantees; implementations must establish and record their premises.</text>
</svg>
