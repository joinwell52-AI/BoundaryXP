name: BoundX verification
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  conformance:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, node: 22 }
          - { os: ubuntu-latest, node: 24 }
          - { os: windows-latest, node: 24 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: python -m venv .venv
      - name: Install research dependencies (Linux)
        if: runner.os != 'Windows'
        run: .venv/bin/python -m pip install -r python/requirements.txt
      - name: Install research dependencies (Windows)
        if: runner.os == 'Windows'
        run: .venv\Scripts\python.exe -m pip install -r python/requirements.txt
      - run: npm test
      - run: npm run test:ui
      - name: Python tests (Linux)
        if: runner.os != 'Windows'
        run: .venv/bin/python -m unittest discover -s python -p "test_*.py"
      - name: Python tests (Windows)
        if: runner.os == 'Windows'
        run: .venv\Scripts\python.exe -m unittest discover -s python -p "test_*.py"
      - run: npm run test:docs
