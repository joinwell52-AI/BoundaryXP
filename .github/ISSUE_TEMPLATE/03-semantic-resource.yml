name: "L2/L3 语义问题 / Semantic resource issue"
description: "报告词条、歧义、映射或字典格式问题 / Discuss terms, ambiguity, mappings or dictionary format."
title: "[L2/L3] "
body:
  - type: "markdown"
    attributes:
      value: "欢迎使用中文或英文。尚无完整复现也可以先描述问题。此 Issue 公开可见，请勿上传密钥、账号信息、客户资料或个人运行日志。 / Chinese and English are welcome. Start with what you know; a complete reproduction is not required. This issue is public: omit credentials, account details, customer material and personal runtime logs."
  - type: "dropdown"
    id: "layer"
    attributes:
      label: "相关层 / Layer"
      options:
        - "L2 · 行业 / Industry"
        - "L3 · 企业 / Enterprise"
        - "两者 / Both"
        - "不确定 / Unsure"
  - type: "input"
    id: "identity"
    attributes:
      label: "资源身份 / Resource identity"
      description: "如已知，请填写词库标识、版本和摘要；不知道可以留空。 / Identifier, version and digest if known."
    validations:
      required: false
  - type: "textarea"
    id: "problem"
    attributes:
      label: "语义问题 / Semantic problem"
      description: "说明歧义、缺项、冲突或疑问。 / Describe ambiguity, missing information, a conflict or a question."
    validations:
      required: true
  - type: "textarea"
    id: "example"
    attributes:
      label: "可公开的最小例子 / Publishable minimal example"
      description: "提供少量词条或原文；真实企业资料请先匿名化并确认可公开。 / Share a small excerpt; anonymize real enterprise material and confirm you may publish it."
    validations:
      required: false
  - type: "textarea"
    id: "proposal"
    attributes:
      label: "建议与依据 / Proposal and evidence"
      description: "可选：建议词义、映射或格式修订及来源；请勿由岗位直接推出权限。 / Optional meaning, mapping or format proposal and sources; do not infer authority from a job title."
    validations:
      required: false
