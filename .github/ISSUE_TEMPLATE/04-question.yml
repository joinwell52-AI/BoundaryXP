name: "提问与建议 / Questions and ideas"
description: "方法、使用、功能或贡献方面的问题 / Ask about the method, usage, features or contributions."
title: "[Question] "
body:
  - type: "markdown"
    attributes:
      value: "欢迎使用中文或英文。尚无完整复现也可以先描述问题。此 Issue 公开可见，请勿上传密钥、账号信息、客户资料或个人运行日志。 / Chinese and English are welcome. Start with what you know; a complete reproduction is not required. This issue is public: omit credentials, account details, customer material and personal runtime logs."
  - type: "textarea"
    id: "question"
    attributes:
      label: "你的问题或建议 / Your question or idea"
      description: "不需要先证明缺陷，也不要求先同意本方法。 / No proof of a defect or agreement with the method is required."
    validations:
      required: true
  - type: "textarea"
    id: "context"
    attributes:
      label: "补充上下文 / Optional context"
      description: "可填相关文档、使用目标、已有尝试或希望贡献的方向。 / Link a document, explain your goal or attempts, or describe how you would like to contribute."
    validations:
      required: false
