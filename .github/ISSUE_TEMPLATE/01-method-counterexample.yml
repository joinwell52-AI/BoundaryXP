name: "7+1 方法反例 / Method counterexample"
description: "质疑方法假设、表示或结论 / Challenge assumptions, representation or findings."
title: "[7+1] "
body:
  - type: "markdown"
    attributes:
      value: "欢迎使用中文或英文。尚无完整复现也可以先描述问题。此 Issue 公开可见，请勿上传密钥、账号信息、客户资料或个人运行日志。 / Chinese and English are welcome. Start with what you know; a complete reproduction is not required. This issue is public: omit credentials, account details, customer material and personal runtime logs."
  - type: "textarea"
    id: "claim"
    attributes:
      label: "具体主张或问题 / Claim or question"
      description: "可填论文版本、章节、协议或报告链接；不清楚时描述你的理解。 / Cite an edition, section, protocol or report if known."
    validations:
      required: true
  - type: "textarea"
    id: "example"
    attributes:
      label: "最小反例或推理 / Minimal example or reasoning"
      description: "提供可公开的任务原文、相关关系或论证；暂时没有完整反例也可说明疑问。 / Add publishable source, relations or reasoning; an initial concern is enough."
    validations:
      required: false
  - type: "textarea"
    id: "expected"
    attributes:
      label: "你认为应有的结论及理由 / Expected finding and reasoning"
      description: "如有实际结果，请与预期分开记录。 / Separate an observed result from your expected finding."
    validations:
      required: false
  - type: "input"
    id: "context"
    attributes:
      label: "版本与上下文 / Version and context"
      description: "若涉及软件，注明包版本、模型/宿主或字典版本；不涉及可留空。 / Optional package, model/host and dictionary versions."
    validations:
      required: false
