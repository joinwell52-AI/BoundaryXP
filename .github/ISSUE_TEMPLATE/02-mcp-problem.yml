name: "MCP 使用问题 / MCP problem"
description: "报告安装、接入、工具或报告问题 / Report installation, host, tool or report problems."
title: "[MCP] "
body:
  - type: "markdown"
    attributes:
      value: "欢迎使用中文或英文。尚无完整复现也可以先描述问题。此 Issue 公开可见，请勿上传密钥、账号信息、客户资料或个人运行日志。 / Chinese and English are welcome. Start with what you know; a complete reproduction is not required. This issue is public: omit credentials, account details, customer material and personal runtime logs."
  - type: "textarea"
    id: "problem"
    attributes:
      label: "发生了什么 / What happened"
      description: "简述问题、错误码或受影响的功能。 / Describe the problem, error code or affected behavior."
    validations:
      required: true
  - type: "input"
    id: "environment"
    attributes:
      label: "版本与环境 / Version and environment"
      description: "尽可能填写包版本、宿主及系统，不填密钥、账号或机器私密路径。 / Package version, host and OS if known; omit keys, accounts and private machine paths."
    validations:
      required: false
  - type: "textarea"
    id: "steps"
    attributes:
      label: "最小步骤 / Minimal steps"
      description: "写出已尝试步骤；可以从不完整的复现开始。 / List what you tried; incomplete reproductions are welcome."
    validations:
      required: false
  - type: "textarea"
    id: "comparison"
    attributes:
      label: "实际与预期 / Actual and expected"
      description: "分别说明看到了什么、原本期望什么。 / Distinguish observed behavior from what you expected."
    validations:
      required: false
  - type: "textarea"
    id: "evidence"
    attributes:
      label: "脱敏证据 / Redacted evidence"
      description: "可选：最小输入、错误片段或截图。不要粘贴完整运行历史。 / Optional minimal input, error excerpt or screenshot; omit full runtime history."
    validations:
      required: false
